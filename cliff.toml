# git-cliff configuration for automated changelog generation
# See: https://git-cliff.org/docs/configuration

[changelog]
# Changelog header
header = """
# Changelog

All notable changes to GallifreyDB will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

# Template for the changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
          {% if commit.github.pr_number %} ([#{{ commit.github.pr_number }}]({{ commit.github.pr_url }})){% endif %}\
    {% endfor %}
{% endfor %}\n
"""

# Template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""

# Remove the leading and trailing whitespace from the template
trim = true

[git]
# Parse commits based on conventional commits
conventional_commits = true
# Filter out commits that are not conventional
filter_unconventional = true
# Process each line of a commit as an individual commit
split_commits = false
# Protect breaking changes from being skipped due to matching a skipping commit
protect_breaking_commits = false
# Filter commits based on GitHub labels
filter_commits = false
# Glob pattern for matching git tags
tag_pattern = "v[0-9]*"
# Sort tags chronologically
date_order = false
# Sort commits inside sections by oldest/newest order
sort_commits = "oldest"
# Limit the number of commits included in the changelog
# limit_commits = 42

[git.commit_preprocessors]
# Remove issue numbers from commit messages
# { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" }

[git.commit_parsers]
# Breaking changes
{ message = "^\\w+\\(.*\\)!:", group = "⚠️ BREAKING CHANGES" }
{ body = ".*BREAKING[ -]CHANGE.*", group = "⚠️ BREAKING CHANGES" }
# New features
{ message = "^feat", group = "✨ Features" }
# Bug fixes
{ message = "^fix", group = "🐛 Bug Fixes" }
# Performance improvements
{ message = "^perf", group = "⚡ Performance" }
# Documentation updates
{ message = "^docs", group = "📚 Documentation" }
# Refactoring
{ message = "^refactor", group = "♻️ Refactoring" }
# Code style changes
{ message = "^style", group = "🎨 Style" }
# Tests
{ message = "^test", group = "✅ Testing" }
# Build system
{ message = "^build", group = "🏗️ Build" }
# CI/CD
{ message = "^ci", group = "👷 CI/CD" }
# Chores
{ message = "^chore\\(release\\):", skip = true }
{ message = "^chore\\(deps\\):", group = "⬆️ Dependencies" }
{ message = "^chore", group = "🔧 Chores" }
# Reverts
{ message = "^revert", group = "⏪ Reverts" }

[github]
# GitHub integration for PRs and issues
owner = "madmax983"
repo = "GallifreyDB"
