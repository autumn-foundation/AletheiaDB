# AletheiaDB local dev stack — `docker compose up -d` to get a persistent
# graph database listening on localhost:1963, in the same shape as
# `postgres:16` behind a named volume.
#
# Named volume keeps WAL + indexes between `docker compose down` runs; use
# `docker compose down -v` to wipe.

services:
  aletheiadb:
    build:
      context: .
      dockerfile: Dockerfile
    image: aletheiadb:dev
    container_name: aletheiadb
    restart: unless-stopped
    ports:
      - "${ALETHEIADB_HOST_PORT:-1963}:1963"
    volumes:
      - aletheiadb_data:/var/lib/aletheiadb
    environment:
      ALETHEIADB_PORT: "1963"
      ALETHEIADB_HOST: "0.0.0.0"
      ALETHEIADB_DATA_DIR: "/var/lib/aletheiadb"
      # Authentication is REQUIRED by default (Issue #3350): the server
      # refuses to start with zero credentials, so compose refuses to start
      # without this variable. Generate one with e.g. `openssl rand -base64
      # 32`, then mint role-scoped keys over POST /admin/keys — see
      # docs/guides/security-quickstart.md. (Anonymous mode exists as an
      # explicit opt-in via ALETHEIADB_AUTH_MODE=anonymous, but it grants
      # every caller full unauthenticated access and is not suitable outside
      # isolated local development.)
      ALETHEIADB_BOOTSTRAP_ADMIN_KEY: "${ALETHEIADB_BOOTSTRAP_ADMIN_KEY:?set ALETHEIADB_BOOTSTRAP_ADMIN_KEY (see docs/guides/security-quickstart.md)}"
      # Override for remote clients during development. Leave unset (or set
      # to false) for production — restrictive CORS is the default.
      ALETHEIADB_CORS_PERMISSIVE: "${ALETHEIADB_CORS_PERMISSIVE:-false}"
      ALETHEIADB_CORS_ORIGINS: "${ALETHEIADB_CORS_ORIGINS:-}"
    healthcheck:
      # /status is metrics-class: in required-auth mode the probe needs a
      # credential (any role). The x-api-key header is ignored in anonymous
      # mode, so this works in both. ($$ = compose escape for a literal $
      # expanded inside the container.)
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent --show-error --header "x-api-key: $$ALETHEIADB_BOOTSTRAP_ADMIN_KEY" http://127.0.0.1:1963/status',
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  aletheiadb_data:
    name: aletheiadb_data
