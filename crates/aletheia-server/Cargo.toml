[package]
name = "aletheia-server"
version = "0.1.0"
edition = "2024"
# autumn-web 0.5.0 is edition 2024 / rust-version 1.88.0.
rust-version = "1.88"
authors = ["AletheiaDB Contributors"]
description = "Production autumn-web 0.5.0 server for AletheiaDB (HTTP + MCP + OpenAPI) — Issue #3524 PR1 skeleton"
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
missing_docs = "warn"

[features]
# Forwarding feature so this crate's tests can `cfg` on whether the Cypher
# engine is compiled into the linked `aletheiadb` rlib. The Code Coverage CI
# job builds `-p aletheiadb -p aletheia-server --features ...,cypher`; declaring
# `cypher` here lets that flag also apply to this package (enabling
# `aletheiadb/cypher`) and keeps `#[cfg(feature = "cypher")]` in the test tree a
# recognized cfg (no `unexpected_cfgs` warning under `-D warnings`). Omitting it
# reproduces the default (Cypher off) build exactly.
cypher = ["aletheiadb/cypher"]

[dependencies]
# autumn-web 0.5.0 — UNRENAMED so its proc-macros' hard-coded `::autumn_web`
# paths resolve (see docs/spikes/autumn-web-migration-spike.md §1). `mcp`
# implies `openapi`; `default-features = false` keeps diesel/db out of the graph.
autumn-web = { version = "0.5.0", default-features = false, features = ["maud", "mcp"] }
# The shared AletheiaDB core: the HTTP serializers/envelope/error type
# (`ApiResponse`, `node_to_query_json`, `AletheiaHttpError`), the constant-time
# `AuthStore`/`AccessClass`/`Role` RBAC model, and the MCP typed node-read
# request/response methods (`AletheiaMcpServer::get_node`/`list_nodes`/`count_nodes`).
# `observability` exposes the internal `MetricsRecorder` / `METRICS` atomic
# mirror + `MetricsSnapshot` that the Prometheus `/metrics` exposition endpoint
# (Issue #3624) renders. It only pulls in `dep:tracing` (already brought in by
# `http-server`), so it adds no new heavy dependency to the graph.
aletheiadb = { path = "../..", features = ["http-server", "mcp-server", "observability"] }
axum = { version = "0.8" }
tower-http = { version = "0.6", features = ["set-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `time` feature: resource_limits' `run_with_timeout` uses `tokio::time::timeout`.
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time"] }
# Rate-limit primitive (Lane B3). `default-features = false` drops the `tonic`
# default so only the axum body conversion is compiled in; autumn-web 0.5 /
# axum 0.8 / tower 0.5 compatible.
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
# Names `governor::middleware::NoOpMiddleware` in `governor_layer`'s return
# type (tower_governor does not re-export it). Version pinned to tower_governor's.
governor = "0.10"
# The custom `/mcp` security gate (B4) is a hand-written `tower::Layer` /
# `tower::Service`; `secure_mcp` accepts any such layer. autumn-web 0.5 / axum
# 0.8 are on tower 0.5.
tower = { version = "0.5" }
# Cursor-signing primitive (Lane B4): base64url token encoding, SHA-256 for the
# hand-rolled HMAC (no extra hmac crate — mirrors legacy `src/mcp/cursor.rs`),
# constant-time MAC compare via subtle, a random per-process secret via rand,
# and zeroize to wipe the secret on drop. Versions match the main crate.
base64 = "0.22"
sha2 = "0.11"
subtle = "2.6"
rand = "0.8"
zeroize = "1"
# Changefeed SSE stream (Issue #3375): `ReceiverStream` adapts the mpsc channel a
# `spawn_blocking` recv loop feeds into the `Sse<impl Stream>` response body.
tokio-stream = "0.1"

[dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time"] }
# `tower::ServiceExt::oneshot` drives the legacy 0.4 router in parity tests.
tower = { version = "0.5", features = ["util"] }
# Chain-enabled DB fixtures (verify_chain / export_chain_head parity, PR7) need a
# durable data dir; matches the main crate's tempfile pin.
tempfile = "3.27"
