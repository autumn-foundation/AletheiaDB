[package]
name = "gallifreydb"
version = "0.1.0"
edition = "2024"
authors = ["GallifreyDB Contributors"]
description = "A high-performance bi-temporal graph database for LLM integration"
license = "MIT"
repository = "https://github.com/yourusername/gallifreydb"
keywords = ["database", "graph", "temporal", "bitemporal", "llm"]
categories = ["database-implementations"]

[dependencies]
dashmap = "6.1"
crc32fast = "1.4"
parking_lot = "0.12"
usearch = { git = "https://github.com/madmax983/USearch", branch = "fix/rust-move-semantics" }
arc-swap = "1.7"
quick_cache = "0.6"
crossbeam-channel = "0.5"
bitcode = "0.6"
memmap2 = "0.9"

# Configuration support (optional TOML config files)
serde = { version = "1.0", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }

# Optional Tracy profiling support
tracy-client = { version = "0.17", optional = true, default-features = false }

# Observability framework (optional via feature flags)
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"], optional = true }
tracing-tracy = { version = "0.11", optional = true }
tracing-honeycomb = { version = "0.4", optional = true }
libhoney-rust = { version = "0.1", optional = true }

# Prometheus metrics (optional)
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.17", optional = true }

# Embedding generation dependencies (all optional via feature flags)
# Async runtime for API-based embedding providers
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"], optional = true }
async-trait = { version = "0.1", optional = true }

# HTTP client for API-based providers (OpenAI, HuggingFace, Ollama)
reqwest = { version = "0.11", features = ["json"], optional = true }
serde_json = { version = "1.0", optional = true }

# ONNX runtime for local model inference
ort = { version = "2.0.0-rc.0", optional = true }
tokenizers = { version = "0.15", optional = true }
num_cpus = { version = "1.16", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
rand = "0.8"
tempfile = "3.8"
# Tokio for async tests
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "test-util"] }
# Mutex for serializing env var tests
lazy_static = "1.4"
rayon = "1.8"

[features]
# Enable Tracy profiling (use with: cargo build --release --features tracy)
tracy = ["tracy-client/enable"]

# Observability features
observability = ["dep:tracing", "dep:tracing-subscriber"]
observability-tracy = ["observability", "dep:tracing-tracy", "tracy"]
observability-honeycomb = ["observability", "dep:tracing-honeycomb", "dep:libhoney-rust"]
observability-prometheus = ["observability", "dep:metrics", "dep:metrics-exporter-prometheus"]

# Default features
default = ["config-toml"]

# Configuration file support (TOML)
config-toml = ["dep:serde", "dep:toml"]

# Embedding generation features
embeddings = ["dep:tokio", "dep:async-trait", "dep:serde_json"]

# Individual provider features (each implies 'embeddings')
embedding-openai = ["embeddings", "dep:reqwest"]
embedding-huggingface = ["embeddings", "dep:reqwest"]
# IMPORTANT: ONNX provider is currently a PLACEHOLDER - returns errors, not functional
embedding-onnx = ["embeddings", "dep:ort", "dep:tokenizers", "dep:num_cpus"]
embedding-ollama = ["embeddings", "dep:reqwest"]

# Enable all embedding providers
embedding-all = [
    "embedding-openai",
    "embedding-huggingface",
    "embedding-onnx",
    "embedding-ollama"
]

[profile.dev]
# Fast compilation for development
opt-level = 0
debug = true

[profile.test]
# Optimize tests a bit for faster execution
opt-level = 1

[profile.release]
# Maximum optimization for production
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false  # Keep symbols for profiling

[profile.bench]
# Benchmark profile
inherits = "release"
debug = true  # Enable debug symbols for profiling

# Coverage configuration for llvm-cov
[package.metadata.llvm-cov]
# Fail if coverage drops below these thresholds
fail-under-lines = 80.0
fail-under-functions = 75.0

# Exclude certain files from coverage
exclude = [
    "src/main.rs",
    "benches/*",
    "tests/*",
]

# Performance targets - lightweight validation of key performance metrics
[[bench]]
name = "performance_targets"
harness = false
path = "benches/performance_targets.rs"
required-features = []

# Storage layer - raw storage primitives and fast path
[[bench]]
name = "current_state"
harness = false
path = "benches/current_state.rs"
required-features = []

# High-level API - includes transaction overhead and API layer
[[bench]]
name = "gallifreydb"
harness = false
path = "benches/gallifreydb.rs"
required-features = []

# Persistence layer - durability modes and checkpoint operations
[[bench]]
name = "durability_modes"
harness = false
path = "benches/durability_modes.rs"

[[bench]]
name = "checkpoints"
harness = false
path = "benches/checkpoints.rs"

# Transaction layer - ACID guarantees and transaction overhead
[[bench]]
name = "transactions"
harness = false
path = "benches/transactions.rs"
required-features = []

# Temporal layer - time-travel queries and version reconstruction
[[bench]]
name = "temporal_query"
harness = false
path = "benches/temporal_query.rs"
required-features = []

[[bench]]
name = "temporal_vector"
harness = false
path = "benches/temporal_vector.rs"
required-features = []

# Vector operations - similarity metrics and HNSW k-NN search
[[bench]]
name = "vector_similarity"
harness = false
path = "benches/vector_similarity.rs"
required-features = []

[[bench]]
name = "hnsw_index"
harness = false
path = "benches/hnsw_index.rs"
required-features = []

[[bench]]
name = "wal_serialization"
harness = false
path = "benches/wal_serialization.rs"
required-features = []

# Hybrid queries - Phase 4 graph+vector operations
[[bench]]
name = "hybrid_query"
harness = false
path = "benches/hybrid_query.rs"
required-features = []

# Patch libhoney-rust to use git version with updated dependencies
# This overrides the crates.io version for ALL dependencies (including tracing-honeycomb)
# Reason: crates.io v0.1.6 uses reqwest 0.10 with known CVEs
# Git version uses reqwest 0.11 and tokio 1.0 (updated Jan 2021, not published)
# See: https://github.com/nlopes/libhoney-rust/issues/80
[patch.crates-io]
libhoney-rust = { git = "https://github.com/nlopes/libhoney-rust" }
