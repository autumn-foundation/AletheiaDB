[package]
name = "aletheiadb"
version = "0.1.0"
edition = "2024"
authors = ["AletheiaDB Contributors"]
description = "A high-performance bi-temporal graph database for LLM integration"
license = "MIT"
repository = "https://github.com/madmax983/AletheiaDB"
keywords = ["database", "graph", "temporal", "bitemporal", "llm"]
categories = ["database-implementations"]

[dependencies]
dashmap = "6.1"
crc32fast = "1.4"
parking_lot = "0.12"
usearch = { git = "https://github.com/madmax983/USearch", rev = "ca8a0213cc56f43354b35ffc83e12f033993fd4a" }
arc-swap = "1.7"
quick_cache = "0.6"
crossbeam-channel = "0.5"
bitcode = "0.6"
zstd = "0.13"
memmap2 = "0.9"
thiserror = "2.0"
smallvec = "1.13"
chrono = "0.4"

# Force native-tls to 0.2.16 to avoid build breakage in 0.2.17
native-tls = "=0.2.16"

# Configuration support (optional TOML config files)
serde = { version = "1.0", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }

# Optional Tracy profiling support
tracy-client = { version = "0.18", optional = true, default-features = false }

# Observability framework (optional via feature flags)
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"], optional = true }
tracing-tracy = { version = "0.11", optional = true }

# Prometheus metrics (optional)
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.17", optional = true }

# MCP server support (optional)
# Note: rmcp re-exports schemars, so we don't need a separate dependency
rmcp = { version = "0.13", features = ["server", "transport-io"], optional = true }
base64 = { version = "0.22", optional = true }

# HTTP server support (optional)
actix-web = { version = "4.9", optional = true }
actix-cors = { version = "0.7", optional = true }
actix-rt = { version = "2.10", optional = true }

# Embedding generation dependencies (all optional via feature flags)
# Async runtime for API-based embedding providers
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"], optional = true }
async-trait = { version = "0.1", optional = true }

# HTTP client for API-based providers (OpenAI, HuggingFace, Ollama) and sharding RPC
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls"], default-features = false, optional = true }
serde_json = { version = "1.0", optional = false }

# ONNX runtime for local model inference
ort = { version = "2.0.0-rc.0", optional = true }
tokenizers = { version = "0.15", optional = true }
num_cpus = { version = "1.16", optional = true }

# Redb for tiered cold storage (pure Rust, ADR-0025)
redb = "3.1"

# SQL parser for SQL:2011 temporal syntax support (optional)
sqlparser = { version = "0.40", optional = true }

# Parallel iteration for sharded vector index
rayon = "1.8"
comfy-table = "7.2.2"
crossterm = "0.29.0"

[dev-dependencies]
criterion = "0.8"
proptest = "1.4"
rand = "0.8"
tempfile = "3.8"
serial_test = "3.0"
# Tokio for async tests
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "test-util"] }
# Mutex for serializing env var tests
lazy_static = "1.4"
# Readline with auto-complete for examples
rustyline = "17.0"
# Loom for concurrency testing
loom = { version = "0.7.2", features = ["checkpoint"] }

[features]
# Nova experimental features
nova = []

# Enable Tracy profiling (use with: cargo build --release --features tracy)
tracy = ["tracy-client/enable"]

# Observability features
observability = ["dep:tracing", "dep:tracing-subscriber"]
observability-tracy = ["observability", "dep:tracing-tracy", "tracy"]
observability-prometheus = ["observability", "dep:metrics", "dep:metrics-exporter-prometheus"]

# Default features
default = ["config-toml"]

# Async runtime support
tokio = ["dep:tokio"]

# Configuration file support (TOML)
config-toml = ["dep:serde", "dep:toml"]

# Embedding generation features
embeddings = ["dep:tokio", "dep:async-trait"]

# Individual provider features (each implies 'embeddings')
embedding-openai = ["embeddings", "dep:reqwest"]
embedding-huggingface = ["embeddings", "dep:reqwest"]
# IMPORTANT: ONNX provider is currently a PLACEHOLDER - returns errors, not functional
embedding-onnx = ["embeddings", "dep:ort", "dep:tokenizers", "dep:num_cpus"]
embedding-ollama = ["embeddings", "dep:reqwest"]

# Enable all embedding providers
embedding-all = [
    "embedding-openai",
    "embedding-huggingface",
    "embedding-onnx",
    "embedding-ollama"
]

# MCP server support
mcp-server = ["dep:rmcp", "dep:tokio", "dep:serde", "dep:base64"]

# Sharding RPC client support (uses blocking reqwest)
sharding-rpc = ["dep:reqwest", "dep:serde"]

# SQL:2011 temporal syntax support
sql = ["dep:sqlparser"]

# HTTP server support (Issue #465)
http-server = ["dep:actix-web", "dep:actix-cors", "dep:actix-rt", "dep:tokio", "dep:serde"]

# MVCC snapshot-focused integration tests
mvcc-snapshots-tdd = []

[profile.dev]
# Fast compilation for development
opt-level = 0
debug = true

[profile.test]
# Optimize tests a bit for faster execution
opt-level = 1

[profile.release]
# Maximum optimization for production
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false  # Keep symbols for profiling

[profile.bench]
# Benchmark profile
inherits = "release"
debug = true  # Enable debug symbols for profiling

# Coverage configuration for llvm-cov
[package.metadata.llvm-cov]
# Fail if coverage drops below these thresholds
fail-under-lines = 80.0
fail-under-functions = 75.0

# Exclude certain files from coverage
exclude = [
    "src/main.rs",
    "src/bin/**",
    "benches/**",
    "tests/**",
    "examples/**",
]

# Examples with required features
# Embedding examples require their respective feature flags
[[example]]
name = "embedding_openai"
required-features = ["embedding-openai"]

[[example]]
name = "embedding_huggingface"
required-features = ["embedding-huggingface"]

[[example]]
name = "embedding_ollama"
required-features = ["embedding-ollama"]

[[example]]
name = "embedding_onnx"
required-features = ["embedding-onnx"]

[[example]]
name = "embedding_comparison"
required-features = ["embedding-all"]

# Recovery examples demonstrating database recovery functionality
[[example]]
name = "basic_recovery"
path = "examples/recovery/basic_recovery.rs"

[[example]]
name = "manual_recovery"
path = "examples/recovery/manual_recovery.rs"

[[example]]
