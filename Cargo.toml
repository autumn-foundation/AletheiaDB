[package]
name = "aletheiadb"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
authors = ["AletheiaDB Contributors"]
description = "A high-performance bi-temporal graph database for LLM integration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/madmax983/AletheiaDB"
homepage = "https://madmax983.github.io/AletheiaDB/"
documentation = "https://docs.rs/aletheiadb"
readme = "README.md"
keywords = ["database", "graph", "temporal", "bitemporal", "llm"]
categories = ["database-implementations", "data-structures"]

# Workspace root (added for the autumn-web 0.5.0 migration spike, Issue #3524).
# `aletheia-autumn-spike` is an isolated member crate that depends on
# autumn-web 0.5 UNRENAMED (so its proc-macros' hard-coded `::autumn_web`
# paths resolve) — see docs/spikes/autumn-web-migration-spike.md for why an
# isolated crate is required. `default-members = ["."]` keeps bare
# `cargo build/test/clippy` scoped to the root `aletheiadb` package only, so
# the existing CI gates are entirely unaffected; the spike gets its own gates
# (`cargo … -p aletheia-autumn-spike`, `just spike-check`).
[workspace]
members = ["crates/autumn-spike"]
default-members = ["."]
# `python/` and `fuzz/` are independent crates with their own manifests (the
# Python wheels + cargo-fuzz workflows build them standalone); keep them OUT of
# this workspace so those workflows still resolve.
exclude = ["python", "fuzz"]

[dependencies]
bytemuck = { version = "1.25.0", features = ["extern_crate_alloc", "derive"] }
dashmap = "6.1"
crc32fast = "1.4"
parking_lot = "0.12"
usearch = "2.25.2"
# SIMD-accelerated vector distance kernels (Issue #426). Optional: enabled via
# the `simsimd` feature (on by default). Provides runtime-dispatched x86
# AVX2/AVX-512 AND ARM NEON/SVE kernels, replacing the crate's hand-written
# x86-only unsafe SIMD. When the feature is off the scalar fallback is used.
# Pinned to patch-only within 6.5 (defense-in-depth for a C-compiling dep;
# still admits security patches). Resolves to 6.5.16 in Cargo.lock.
simsimd = { version = "~6.5", optional = true }
arc-swap = "1.9"
quick_cache = "0.6"
crossbeam-channel = "0.5"
bitcode = "0.6"
zstd = "0.13"
memmap2 = "0.9"
thiserror = "2.0"
smallvec = "1.13"
chrono = "0.4"
arbitrary = { version = "1.4", features = ["derive"], optional = true }

# Pin native-tls only when features that pull reqwest are active.
# Kept optional so the Python SDK build (no reqwest features) has no OpenSSL dep.
native-tls = { version = "=0.2.18", optional = true }

# Configuration support (optional TOML config files)
serde = { version = "1.0", features = ["derive"], optional = true }
toml = { version = "1.1", optional = true }

# Optional Tracy profiling support
tracy-client = { version = "0.18", optional = true, default-features = false }

# Observability contract (optional via feature flags)
tracing = { version = "0.1", optional = true }
metrics = { version = "0.24", optional = true }

# OpenTelemetry distributed tracing (Issue #3376), optional via the `otel`
# feature. The OTLP exporter uses the HTTP/protobuf transport over the
# already-present `reqwest` client, so no tonic/protoc build dependency is
# introduced. `tracing-opentelemetry` bridges the crate's existing `tracing`
# spans (ADR 0056) into OpenTelemetry; `tracing-subscriber` provides the
# registry the OTel layer installs into.
opentelemetry = { version = "0.30", optional = true }
opentelemetry_sdk = { version = "0.30", optional = true, features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", optional = true, default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
tracing-opentelemetry = { version = "0.31", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["registry", "env-filter", "fmt", "std"] }

# MCP server support (optional)
# Note: rmcp re-exports schemars, so we don't need a separate dependency
rmcp = { version = "1.7", features = ["server", "transport-io"], optional = true }
base64 = { version = "0.22", optional = true }

# HTTP server support (optional) — built on autumn-web (Axum-based).
# default-features disabled: autumn's defaults pull in Postgres+Diesel, Maud, htmx,
# Tailwind, Moka cache — most irrelevant to a JSON API on top of an embedded DB.
# `maud` is kept because autumn-web 0.2.0 has a bug where `error_pages` imports
# maud unconditionally; see ADR 0055 for details.
autumn-web = { version = "0.4", optional = true, default-features = false, features = ["maud"] }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", optional = true, features = ["cors", "trace", "set-header"] }

# Embedding generation dependencies (all optional via feature flags)
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"], optional = true }
embed_anything = { version = "0.6.7", optional = true }
# embed_anything 0.6.7 accepts candle ^0.9.1 but does not build against 0.9.2's
# wider CpuStorage enum yet. Keep these pins until upstream handles the new variants.
candle-core = { version = "=0.9.1", optional = true }
candle-nn = { version = "=0.9.1", optional = true }
candle-transformers = { version = "=0.10.2", optional = true }

# HTTP client for sharding RPC and optional integrations
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false, optional = true }
serde_json = { version = "1.0", optional = false }

# Redb for tiered cold storage (pure Rust, ADR-0025)
redb = "4.1"

# SQL parser for SQL:2011 temporal syntax support (optional)
sqlparser = { version = "0.40", optional = true }

# CSV parsing for the bulk graph importer (optional, Issue #3211)
csv = { version = "1.3", optional = true }

# Parquet columnar import/export for analytics interoperability (optional, Issue #3364).
# arrow-rs `parquet` crate with the `arrow` integration (ArrowWriter /
# ParquetRecordBatchReader, list<float32> embedding columns, streaming row groups)
# and `snap` (Snappy) compression. Default features are disabled to keep the
# dependency surface minimal; enabled via the `parquet` feature flag only.
parquet = { version = "59", default-features = false, features = ["arrow", "snap"], optional = true }
# arrow-rs umbrella crate: gives `arrow::array` (RecordBatch, typed arrays) and
# `arrow::datatypes` used to physically decode Parquet columns on import. Kept in
# lockstep with the `parquet` version. Default features off; `array`/`datatypes`
# are unconditional so the compute/csv/json/ipc kernels are not pulled in.
arrow = { version = "59", default-features = false, optional = true }

# Parallel iteration for sharded vector index
rayon = "1.12"
comfy-table = "7.2.2"
crossterm = "0.29.0"
rand = { version = "0.8", features = ["small_rng"] }
# tempfile is needed at runtime: AletheiaDB::new() backs its WAL with a
# temporary directory so the default constructor is truly ephemeral.
tempfile = "3.27"

# Encryption at rest (ADR-0028)
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.13"
sha2 = "0.11"
zeroize = { version = "1.8", features = ["derive"] }
aws-sdk-kms = { version = "1.106.0", optional = true }

# Constant-time equality for API-key digest comparison (Issue #3350).
subtle = "2.6"

# Per-platform O_NOFOLLOW for hardened key-file writes (Issue #3351). Already
# present transitively; pinned as a direct dep so the audit signing path can name
# the correct constant instead of hardcoding a platform-specific integer.
libc = "0.2"

# Ed25519 asymmetric signatures for signed audit-export artifacts (Issue #3358).
# Chosen over HMAC so third parties verify offline with ONLY the signer's public
# key. Pure-Rust, RFC 8032 deterministic signatures → reproducible artifacts.
ed25519-dalek = { version = "2", optional = true }

[dev-dependencies]
criterion = "0.8"
proptest = "1.11"
serial_test = "3.4"
# Tokio for async tests
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "test-util"] }
# Mutex for serializing env var tests
lazy_static = "1.4"
# Readline with auto-complete for examples
rustyline = "18.0"
# Loom for concurrency testing
loom = { version = "0.7.2", features = ["checkpoint"] }
rand = "0.8"

[features]
# Stable: Semantic search cohort (graduated 0.1).
# Retrieval, matching, clustering, traversal, entity resolution.
# Modules: fishing, gestalt, cartographer, highlander, janus, chameleon,
# semantic_navigator, concept_algebra, serendipity, voyager, spectre,
# telepathy, tapestry, horizon, mosaic.
semantic-search = []

# Deterministic Simulation Testing (DST) framework (issue #154).
# Provides SimulatedClock, FaultInjector, SimulatedStorage, SimulatedScheduler,
# and the Simulator orchestrator for testing temporal consistency under
# controlled fault conditions.
simulation = []

# Internal fuzzing support for cargo-fuzz targets (issue #155).
# This exposes cfg-gated parser hooks and Arbitrary implementations without
# changing the normal public API surface.
fuzzing = ["dep:arbitrary", "simulation"]

# Experimental: prediction, synthesis, counterfactual simulation.
# Modules: prophet, dreamer, omen, oracle, hindsight, muse, luna, metaphor,
# synergy, chimera, alchemy.
# Depends on semantic-diagnostics (alchemy uses wormhole).
semantic-reasoning = ["semantic-diagnostics"]

# Experimental: bi-temporal + semantic analysis.
# Modules: sherlock, chronos, echo, kairos, temporal_narrative, temporal_diff,
# aura, mnemosyne, ariadne.
semantic-temporal = []

# Experimental: anomaly detection, validation, health monitoring.
# Modules: dissonance, sentinel, fossil, tremor, polygraph, wormhole, ripple,
# entanglement, thermos, paradox.
semantic-diagnostics = []

# Experimental: concept characterization + LLM/visualization export.
# Modules: archetype, prism, gravity, sybil, synapse, kaleidoscope, papyrus,
# graph_context, wildfire.
# Depends on semantic-temporal (graph_context uses temporal_narrative).
semantic-characterization = ["semantic-temporal"]

# Experimental "Nova" R&D umbrella.
# Enables every semantic-* cohort that is still marked experimental. Removing a
# cohort from this list is how we "graduate" it — the flag itself stays, so
# downstream callers opting into the cohort directly keep working.
# The graduated `semantic-search` cohort is NOT included.
nova = [
    "semantic-reasoning",
    "semantic-temporal",
    "semantic-diagnostics",
    "semantic-characterization",
]

# Enable Tracy profiling (use with: cargo build --release --features tracy)
tracy = ["tracy-client/enable"]

# Observability features
observability = ["dep:tracing"]
metrics-rs = ["observability", "dep:metrics"]

# OpenTelemetry distributed tracing + OTLP export (Issue #3376).
# Composes with `observability` (reuses its span vocabulary / ADR 0056
# contract) and adds an OTLP exporter, sampler, W3C context propagation, and
# a process-wide subscriber installer. Zero cost when absent: the whole
# `observability::otel` module and every call site are `#[cfg]`-compiled out.
otel = [
    "observability",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:tokio",
]

# SIMD-accelerated vector kernels via the `simsimd` crate (Issue #426).
# On by default so stock builds get x86 AVX2/AVX-512 and ARM NEON/SVE
# acceleration through simsimd's runtime dispatch. Building with
# `--no-default-features` (or otherwise omitting this feature) falls back to the
# portable scalar kernels, which the compiler auto-vectorizes.
simsimd = ["dep:simsimd"]

# Default features
default = ["config-toml", "audit-export", "simsimd"]

# Signed audit export of entity history for compliance (Issue #3358).
# Pulls Ed25519 (asymmetric offline-verifiable signatures) and serde (artifact
# (de)serialization). On by default so the `aletheia` CLI ships audit-export /
# audit-verify; cleanly excluded under --no-default-features.
audit-export = ["dep:ed25519-dalek", "dep:serde"]

# Async runtime support
tokio = ["dep:tokio"]

# Unified serde support (Issue #3390).
# Single flag that pulls in the optional `serde` dependency and gates every
# `#[derive(Serialize, Deserialize)]` / serde attribute in the crate. Any
# feature that needs serde derives depends on this rather than `dep:serde`
# directly, so serde-enabled code compiles identically regardless of which
# high-level feature turned it on.
serde = ["dep:serde"]

# Configuration file support (TOML)
config-toml = ["serde", "dep:toml"]

# Embedding generation via embed_anything.
embeddings = [
    "dep:tokio",
    "dep:embed_anything",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
]

# ONNX embedding support pulls in embed_anything's ort backend.
embeddings-onnx = ["embeddings", "embed_anything/ort"]

# MCP server support (exposes the audit_export tool, so it implies audit-export)
mcp-server = ["dep:rmcp", "dep:tokio", "serde", "dep:base64", "audit-export"]

# Sharding RPC client support (uses blocking reqwest)
sharding-rpc = ["dep:reqwest", "serde", "dep:native-tls"]

# SQL:2011 temporal syntax support
sql = ["dep:sqlparser"]

# Cypher query language support
cypher = []

# Bulk graph importer for CSV/JSONL with per-row valid-time backfill (Issue #3211).
# serde_json (JSONL) and chrono (timestamp parsing) are already non-optional deps,
# so the only extra dependency is the `csv` reader. `serde` is pulled so the
# Neo4j importer's fidelity report (Issue #3356) is always machine-serializable.
import = ["dep:csv", "serde"]

# Parquet columnar import/export for analytics interoperability (Issue #3364).
# Builds on the #3211 import layer (shares NodeMapping/EdgeMapping/ColumnType) and
# adds a columnar codec via the arrow-rs `parquet` crate. Off by default so the
# arrow/parquet dependency stays out of default builds.
parquet = ["dep:parquet", "dep:arrow", "import"]

# HTTP server support (Issue #465) — built on autumn-web.
http-server = [
    "dep:autumn-web",
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:tokio",
    "serde",
    "dep:base64",
    "dep:tracing",
]

# MVCC snapshot-focused integration tests
mvcc-snapshots-tdd = []

# Encryption at rest (ADR-0028)
encryption = ["serde"]

# AWS KMS key provider (optional)
encryption-aws-kms = ["encryption", "dep:tokio"]

# HashiCorp Vault key provider (optional)
encryption-vault = ["encryption", "dep:tokio", "dep:reqwest", "dep:native-tls"]
aws-sdk-kms = ["dep:aws-sdk-kms"]

[profile.dev]
# Fast compilation for development
opt-level = 0
debug = true

[profile.test]
# Optimize tests a bit for faster execution
opt-level = 1

[profile.release]
# Maximum optimization for production
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false  # Keep symbols for profiling

[profile.bench]
# Benchmark profile
inherits = "release"
debug = true  # Enable debug symbols for profiling

# Coverage configuration for llvm-cov
[package.metadata.llvm-cov]
# Fail if coverage drops below these thresholds
fail-under-lines = 80.0
fail-under-functions = 75.0

# Exclude certain files from coverage
exclude = [
    "src/bin/**",
    "benches/**",
    "tests/**",
    "examples/**",
    "python/**",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(fuzzing)'] }

