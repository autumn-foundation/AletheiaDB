name: Benchmarks

on:
  push:
    branches: [ main, trunk ]
  pull_request:
    branches: [ main, trunk ]
  schedule:
    # Run benchmarks weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allow manual trigger

# Auto-cancel old runs when new commits are pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


env:
  CARGO_TERM_COLOR: always

# Permissions needed for benchmark actions
permissions:
  contents: write      # For pushing benchmark results to gh-pages
  pull-requests: write # For commenting on PRs
  issues: write        # For creating comments

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          # Note: This cache excludes target/criterion, which is cached separately below

      - name: Cache Criterion baselines
        uses: actions/cache@v5
        with:
          path: target/criterion
          # Use branch-based key so baselines persist across dependency changes
          # For PRs: uses head branch name, for trunk: uses 'trunk'
          key: ${{ runner.os }}-criterion-${{ github.head_ref || github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-criterion-trunk
            ${{ runner.os }}-criterion-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run benchmarks
        env:
          BENCH_SAMPLE_SIZE: 10
          BENCH_MEASUREMENT_TIME: 1
          BENCH_WARMUP_TIME: 1
        run: |
          set -o pipefail  # Ensure piped commands propagate failures

          # Determine which benchmarks to run based on trigger type
          # Weekly (scheduled) and manual runs: all benchmarks for comprehensive testing
          # CI runs (push/PR): performance_targets only for fast feedback on key metrics
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running ALL benchmarks (weekly/manual run)..."
            BENCH_TARGETS="--bench checkpoints --bench current_state --bench durability_modes --bench aletheiadb --bench hnsw_index --bench performance_targets --bench temporal_query --bench temporal_vector --bench transactions --bench vector_similarity --bench provenance_write_throughput"
          else
            echo "Running PERFORMANCE TARGETS benchmark only (CI run)..."
            # Performance targets: lightweight benchmark verifying key performance metrics
            BENCH_TARGETS="--bench performance_targets"
          fi

          # Run benchmarks with configured timing parameters
          # BENCH_SAMPLE_SIZE, BENCH_MEASUREMENT_TIME, and BENCH_WARMUP_TIME are read from env
          # Explicit feature set: embeddings-onnx is excluded because ort-sys requires a native
          # C++ ONNX Runtime library not available in CI runners, and no benchmark uses it.
          cargo bench --features "config-toml,observability,semantic-search,embeddings" $BENCH_TARGETS | tee output.txt

          # Verify that Criterion generated output
          if [ ! -d "target/criterion" ]; then
            echo "ERROR: target/criterion directory not found after running benchmarks"
            echo "Benchmark execution may have failed. Check output.txt for details."
            exit 1
          fi

          # Verify that we have some benchmark results
          BENCH_COUNT=$(find target/criterion -name "estimates.json" | wc -l)
          echo "Found $BENCH_COUNT benchmark results in target/criterion"
          if [ "$BENCH_COUNT" -eq 0 ]; then
            echo "ERROR: No benchmark results (estimates.json files) found in target/criterion"
            echo "Benchmarks may have failed to run properly. Check output.txt for details."
            exit 1
          fi

      # ----------------------------------------------------------------------
      # Provenance write-throughput "cost of trust" gate (Issue #3383)
      #
      # Two lanes, per the CI-policy fence:
      #   * SCHEDULED / manual: run the self-gate (PROV_BENCH_GATE=1). Hard-fail
      #     is intentional here -- it ALERTS on a same-run ratio regression and
      #     does NOT block any pull request (this job never gates a PR merge).
      #   * PULL REQUEST: reduced-scale smoke, INFORMATIONAL only. continue-on-
      #     error guarantees it can never fail the PR. Flipping this to blocking
      #     is a one-line change (drop continue-on-error) once a week or two of
      #     scheduled-lane signal proves the gate stable on the runner -- and
      #     that flip is an operator decision, not part of Issue #3383.
      # ----------------------------------------------------------------------
      - name: Provenance write self-gate (scheduled, hard-fail alert)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          # Gate the CPU-bound (Async 1ms-flush, interleaved) arm ratio bounds
          # AND the AC5 recovery <5s budget at the reduced default scale (2000
          # nodes / 4000 edges). Hard-fail here is an ALERT; it never blocks a PR.
          #
          # NOTE: the recovery dataset is populated by a single-writer GroupCommit
          # loop (~10 ms/commit), so the 10K-node/50K-edge REFERENCE scale would
          # take ~10 min to build -- too slow for this shared CI job. The
          # reference scale is reproduced manually / on the performance rig via
          # PROV_BENCH_RECOVERY_NODES=10000 PROV_BENCH_RECOVERY_EDGES=50000 (the
          # reopen, not the build, is what the <5s budget governs). See
          # docs/benchmarks/cost-of-trust.md.
          PROV_BENCH_GATE: '1'
          PROV_BENCH_JSON_OUT: provenance_write_throughput.json
        run: |
          set -o pipefail
          cargo bench --features "config-toml,observability,semantic-search,embeddings" \
            --bench provenance_write_throughput | tee prov-write-gate.txt

      - name: Provenance write smoke (PR, informational / non-blocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          # One interleaved pass (5000 timed writes/config) — a fast smoke.
          PROV_BENCH_WRITES: '5000'
          BENCH_SAMPLE_SIZE: 10
          BENCH_MEASUREMENT_TIME: 1
          BENCH_WARMUP_TIME: 1
          PROV_BENCH_JSON_OUT: provenance_write_throughput.json
        run: |
          # No PROV_BENCH_GATE: report the matrix + JSON artifact, never fail the PR.
          cargo bench --features "config-toml,observability,semantic-search,embeddings" \
            --bench provenance_write_throughput | tee prov-write-smoke.txt

      - name: Upload provenance write-throughput JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: provenance-write-throughput-results
          path: provenance_write_throughput.json

      - name: Generate benchmark JSON
        run: |
          python scripts/generate_benchmark_tables.py \
            --input target/criterion \
            --output benchmark-data.json \
            --format json

      - name: Store historical benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        if: github.event_name != 'pull_request'
        with:
          name: AletheiaDB Benchmarks
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          # Show alert with commit comment on detecting possible performance regression
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          # Use external JSON file instead of gh-pages branch
          # This creates data.js file locally that we can deploy
          external-data-json-path: dev/bench/data.js
          save-data-file: true
          # Generate the benchmark data file locally instead of pushing
          # We'll deploy it with peaceiris/actions-gh-pages in a later step

      - name: Verify benchmark data generation
        if: github.event_name != 'pull_request'
        run: |
          echo "Checking for benchmark-action generated files..."
          if [ -d "dev/bench" ]; then
            echo "✓ dev/bench directory found"
            ls -la dev/bench/ || echo "Directory exists but is empty"
          else
            echo "⚠ dev/bench directory NOT found - benchmark-action may not have generated files"
            echo "This could cause missing historical data on GitHub Pages"
          fi

      - name: Fetch historical data for regression changes
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages-history
        continue-on-error: true # Might fail if gh-pages branch doesn't exist yet

      - name: Generate benchmark HTML tables & PR Summary
        run: |
          echo "Generating benchmark reports..."
          
          # 1. HTML Report (for GH Pages)
          python scripts/generate_benchmark_tables.py \
            --input target/criterion \
            --output benchmark-results \
            --format html

          # 2. PR Summary (Markdown for Step Summary & PR Comment)
          HIST_ARG=""
          if [ -d "gh-pages-history/dev/bench" ]; then
             if [ -f "gh-pages-history/dev/bench/data.js" ]; then
                HIST_ARG="--history gh-pages-history/dev/bench/data.js"
             fi
          fi
          
          python scripts/generate_benchmark_tables.py \
            --input target/criterion \
            --output benchmark-summary.md \
            --format pr-comment \
            $HIST_ARG
          
          cat benchmark-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = fs.readFileSync('benchmark-summary.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
              console.log('Successfully posted benchmark results as PR comment');
            } catch (error) {
              console.log('Could not post PR comment:', error.message);
            }

      - name: Checkout gh-pages to preserve historical data
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages-existing

      - name: Prepare GitHub Pages deployment
        if: github.event_name != 'pull_request'
        run: |
          echo "Preparing GitHub Pages deployment..."

          # Start with ALL existing gh-pages content to preserve everything
          mkdir -p gh-pages
          if [ -d "gh-pages-existing" ]; then
            echo "Copying existing gh-pages content..."
            # Copy everything except .git directory
            rsync -av --exclude='.git' gh-pages-existing/ gh-pages/ || cp -r gh-pages-existing/* gh-pages/ || echo "No existing content"
          fi

          # Add benchmark-action generated data (historical tracking)
          # The benchmark-action with save-data-file creates files in dev/bench
          if [ -d "dev/bench" ]; then
            echo "Copying benchmark-action generated data..."
            mkdir -p gh-pages/dev/bench
            cp -r dev/bench/* gh-pages/dev/bench/
          fi

          # Add our custom HTML benchmark tables
          echo "Copying custom benchmark HTML tables..."
          mkdir -p gh-pages/benchmarks
          cp -r benchmark-results/* gh-pages/benchmarks/

          # Copy Criterion's detailed HTML reports
          echo "Copying Criterion HTML reports..."
          mkdir -p gh-pages/benchmarks/criterion
          if [ -d "target/criterion/report" ]; then
            cp -r target/criterion/report/* gh-pages/benchmarks/criterion/
          else
            echo "Warning: No Criterion report found at target/criterion/report"
          fi

          echo "GitHub Pages content prepared successfully"
          ls -la gh-pages/

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          publish_branch: gh-pages
          keep_files: false  # We manually merged all content, so don't keep separate files
          force_orphan: false  # Don't create orphan commits, preserve history
          commit_message: 'deploy: Update benchmarks and documentation'

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmark-results/
            target/criterion/
            output.txt

  # MCP round-trip p99 latency harness (Issue #3361) — reference/nightly lane.
  # Full fixture scale, ENFORCED p99<5ms gate: a gated scenario over budget
  # HARD-FAILS this job. Runs on the schedule/manual triggers only.
  mcp-roundtrip-nightly:
    name: MCP round-trip latency (nightly, gated)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-mcpbench-${{ hashFiles('**/Cargo.lock') }}

      - name: Run MCP round-trip benchmark (nightly scale, enforced gates)
        env:
          MCP_BENCH_SCALE: nightly
          MCP_BENCH_SAMPLE_SIZE: 1000
          MCP_BENCH_WARMUP: 50
          # Absolute p99<5ms ceiling (exit 3) AND relative committed-baseline
          # p50<=2x regression gate (exit 4) are BOTH enforced here.
          MCP_BENCH_ENFORCE_LATENCY: '1'
          MCP_BENCH_ENFORCE_RELATIVE: '1'
          MCP_BENCH_BASELINE: benchmarks/baselines/mcp_round_trip_baseline.json
          MCP_BENCH_JSON: mcp_round_trip_results.json
        run: |
          # Hard-fail on: registry-completeness (exit 2), an over-budget gated
          # scenario p99>=5ms (exit 3), or a gated scenario p50 > 2x its committed
          # baseline (exit 4). This is the reference enforcement lane; the relative
          # gate is what makes a clean 2x regression fail CI.
          cargo bench --bench mcp_round_trip --features "mcp-server,config-toml"

      - name: Upload MCP latency artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-round-trip-nightly
          path: mcp_round_trip_results.json

  # MCP round-trip smoke lane — reduced scale, INFORMATIONAL on every push/PR.
  # continue-on-error means it never blocks a PR; flip to `false` to make it a
  # required check (a deliberate one-line owner decision).
  mcp-roundtrip-smoke:
    name: MCP round-trip latency (PR smoke, informational)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-mcpbench-${{ hashFiles('**/Cargo.lock') }}

      - name: Run MCP round-trip benchmark (smoke scale, informational)
        env:
          MCP_BENCH_SCALE: smoke
          MCP_BENCH_SAMPLE_SIZE: 100
          MCP_BENCH_WARMUP: 15
          # Not enforcing the p99 gate on the per-PR lane (informational only);
          # registry-completeness (exit 2) is always enforced.
          MCP_BENCH_ENFORCE_LATENCY: '0'
          MCP_BENCH_JSON: mcp_round_trip_results.json
        run: |
          cargo bench --bench mcp_round_trip --features "mcp-server,config-toml"

      - name: Upload MCP latency artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-round-trip-smoke
          path: mcp_round_trip_results.json
