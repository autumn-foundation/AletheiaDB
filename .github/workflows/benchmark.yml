name: Benchmarks

on:
  push:
    branches: [ main, trunk ]
  pull_request:
    branches: [ main, trunk ]
  schedule:
    # Run benchmarks weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allow manual trigger

# Auto-cancel old runs when new commits are pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


env:
  CARGO_TERM_COLOR: always

# Permissions needed for benchmark actions
permissions:
  contents: write      # For pushing benchmark results to gh-pages
  pull-requests: write # For commenting on PRs
  issues: write        # For creating comments

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run all benchmarks once
        run: |
          echo "Running all benchmarks..."
          # Run benchmarks and capture output for github-action-benchmark 'cargo' tool support
          cargo bench --all-features --bench concurrent_reads --bench current_state --bench gallifreydb --bench hnsw_index --bench id_generation --bench persistence --bench string_interning --bench temporal_vector --bench transactions --bench vector_similarity -- --quick | tee output.txt

      - name: Generate benchmark JSON
        run: |
          python scripts/generate_benchmark_tables.py \
            --input target/criterion \
            --output benchmark-data.json \
            --format json

      - name: Store historical benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        if: github.event_name != 'pull_request'
        with:
          name: GallifreyDB Benchmarks
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Show alert with commit comment on detecting possible performance regression
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          # Store in dev/bench for historical charts
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

      - name: Fetch historical data for regression changes
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-history
        continue-on-error: true # Might fail if gh-pages branch doesn't exist yet

      - name: Generate benchmark HTML tables & PR Summary
        run: |
          echo "Generating benchmark reports..."
          
          # 1. HTML Report (for GH Pages)
          python scripts/generate_benchmark_tables.py \
            --input target/criterion \
            --output benchmark-results \
            --format html

          # 2. PR Summary (Markdown for Step Summary & PR Comment)
          HIST_ARG=""
          if [ -d "gh-pages-history/dev/bench" ]; then
             if [ -f "gh-pages-history/dev/bench/data.js" ]; then
                HIST_ARG="--history gh-pages-history/dev/bench/data.js"
             fi
          fi
          
          python scripts/generate_benchmark_tables.py \
            --input target/criterion \
            --output benchmark-summary.md \
            --format pr-comment \
            $HIST_ARG
          
          cat benchmark-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = fs.readFileSync('benchmark-summary.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
              console.log('Successfully posted benchmark results as PR comment');
            } catch (error) {
              console.log('Could not post PR comment:', error.message);
            }

      - name: Checkout gh-pages to preserve historical data
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-existing

      - name: Prepare GitHub Pages deployment
        if: github.event_name != 'pull_request'
        run: |
          # Start with existing gh-pages content to preserve historical data
          mkdir -p gh-pages
          if [ -d "gh-pages-existing/dev" ]; then
            cp -r gh-pages-existing/dev gh-pages/ || echo "No existing dev/ directory"
          fi

          # Add our generated benchmark tables
          mkdir -p gh-pages/benchmarks
          cp -r benchmark-results/* gh-pages/benchmarks/

          # Copy Criterion's detailed HTML reports
          mkdir -p gh-pages/benchmarks/criterion
          cp -r target/criterion/report/* gh-pages/benchmarks/criterion/ || echo "No Criterion report found"

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          publish_branch: gh-pages
          keep_files: true  # Preserve historical benchmark data

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results/
            target/criterion/
            output.txt
