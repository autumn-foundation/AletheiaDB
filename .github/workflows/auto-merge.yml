name: Auto-merge Dependabot PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Also trigger when checks complete
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["CI", "Code Coverage", "Linting", "Security Audit", "Benchmarks"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge:
    name: Auto-merge safe dependency updates
    runs-on: ubuntu-latest
    # Only run on Dependabot PRs with auto-merge-candidate label
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge-candidate')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check update type
        id: check_update
        run: |
          UPDATE_TYPE="${{ steps.metadata.outputs.update-type }}"
          echo "update-type=$UPDATE_TYPE" >> $GITHUB_OUTPUT

          # Determine if this is safe to auto-merge
          if [[ "$UPDATE_TYPE" == "version-update:semver-major" ]]; then
            echo "safe-to-merge=false" >> $GITHUB_OUTPUT
            echo "reason=Major version update requires manual review" >> $GITHUB_OUTPUT
          else
            echo "safe-to-merge=true" >> $GITHUB_OUTPUT
            echo "reason=Patch or minor update" >> $GITHUB_OUTPUT
          fi

      - name: Wait for CI checks
        id: wait_for_checks
        uses: lewagon/wait-on-check-action@v1.4.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          running-workflow-name: 'Auto-merge safe dependency updates'
          allowed-conclusions: success
          # Wait for all critical checks
          check-regexp: '(Test Suite|Code Coverage|Linting|Security Audit|Benchmarks).*'
          # Timeout after 30 minutes to prevent indefinite waiting
          timeout: 1800

      - name: Comment on major version update
        if: steps.check_update.outputs.safe-to-merge == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `⚠️ **Major version update detected**

              This PR updates to a new major version which may contain breaking changes.
              Please review the changelog and test thoroughly before merging.

              **Update type:** ${{ steps.metadata.outputs.update-type }}
              **Dependency:** ${{ steps.metadata.outputs.dependency-names }}

              To merge this PR, remove the \`auto-merge-candidate\` label and review manually.`
            })

      - name: Comment on failed checks
        if: failure() && steps.wait_for_checks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Auto-merge blocked: CI checks failed**

              One or more required CI checks did not pass. Please review the failed checks:

              - Test Suite
              - Code Coverage
              - Linting
              - Security Audit
              - Benchmarks

              The PR will be auto-merged once all checks pass.`
            })

      - name: Auto-approve PR
        if: steps.check_update.outputs.safe-to-merge == 'true' && steps.wait_for_checks.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'APPROVE',
              body: '✅ Auto-approved: Safe dependency update with all CI checks passing.'
            })

      - name: Enable auto-merge
        if: steps.check_update.outputs.safe-to-merge == 'true' && steps.wait_for_checks.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash',
              commit_title: `${{ steps.metadata.outputs.dependency-names }} - ${{ steps.check_update.outputs.reason }}`,
              commit_message: `Auto-merged by Dependabot auto-merge workflow.

              Update type: ${{ steps.metadata.outputs.update-type }}
              All CI checks passed successfully.`
            })

      - name: Comment on successful merge
        if: steps.check_update.outputs.safe-to-merge == 'true' && steps.wait_for_checks.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🎉 **Auto-merged successfully!**

              This ${{ steps.check_update.outputs.reason }} has been automatically merged after all CI checks passed.

              **Update type:** ${{ steps.metadata.outputs.update-type }}
              **Dependency:** ${{ steps.metadata.outputs.dependency-names }}`
            })
